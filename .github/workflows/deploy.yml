# Práctica 3.2 — Pipeline CI/CD de Nebula Arena (variante AWS del material).
#
# Basado en el workflow del material (pruebas → imagen con el SHA del commit →
# registro → actualizar la flota), con las acciones de AWS que indica el
# material: aws-actions/configure-aws-credentials y aws-actions/amazon-ecr-login.
#
# Trabajos:
#   pruebas  : pytest del servidor, del matchmaker y de la tabla de líderes.
#              Si fallan, no se publica nada.
#   smoke    : construye la imagen y juega una partida corta de 10 jugadores contra
#              el contenedor (la "partida simulada corta" del material).
#   publicar : sube nebula-server:<sha> y matchmaker:<sha> a ECR.
#   desplegar: cambia la imagen de la flota en EKS por la del commit. Agones solo
#              reemplaza servidores libres; los Allocated terminan su partida
#              antes de apagarse (drenado).
#
# Identidad: usuario IAM nebula-github con permisos mínimos (infra-aws/github.tf).
# (OIDC sin llaves sería lo ideal, pero el plan gratuito de AWS lo bloquea.)
# publicar y desplegar solo corren si el repositorio tiene configurado
# (Settings → Secrets and variables → Actions):
#   Secretos : AWS_ACCESS_KEY_ID y AWS_SECRET_ACCESS_KEY  (llave del usuario nebula-github)
#   Variable : AWS_ACTIVO = true
# Sin ellos, el pipeline corre pruebas y smoke test y queda en verde.
name: nebula-server-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  CLUSTER: nebula

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Pruebas del servidor de juego
        working-directory: server
        run: pip install -r requirements-dev.txt && pytest -q
      - name: Pruebas del matchmaker
        working-directory: matchmaking
        run: pip install -r requirements-dev.txt && pytest -q
      - name: Pruebas de la tabla de líderes (Lambda)
        working-directory: serverless/aws
        run: pytest -q

  smoke:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Construir imagen
        run: docker build -t nebula-server:${{ github.sha }} server
      - name: Partida simulada de 10 jugadores contra el contenedor
        run: |
          docker run -d --name nebula -p 7654:7654 -p 9100:9100 nebula-server:${{ github.sha }}
          pip install -r server/requirements.txt
          for i in $(seq 1 20); do curl -sf localhost:9100/metrics >/dev/null && break; sleep 1; done
          python server/cliente_prueba.py --url ws://localhost:7654 --jugadores 10 --segundos 10
          curl -s localhost:9100/metrics | grep -E "^nebula_(tick_rate|disconnects_total)"
          # el servidor debe sostener al menos el 95 % de los 20 ticks/s
          python -c "import urllib.request as u,sys; m=u.urlopen('http://localhost:9100/metrics').read().decode(); r=[float(l.split()[1]) for l in m.splitlines() if l.startswith('nebula_tick_rate ')][0]; print('tick rate', r); sys.exit(0 if r >= 19 else 1)"
      - name: Logs del servidor
        if: always()
        run: docker logs nebula

  publicar:
    needs: smoke
    if: github.event_name == 'push' && vars.AWS_ACTIVO == 'true'
    runs-on: ubuntu-latest
    outputs:
      registro: ${{ steps.ecr.outputs.registry }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
          # el número de cuenta no es secreto; si se enmascara, GitHub no deja
          # pasar la dirección del registro al trabajo "desplegar"
          mask-aws-account-id: false
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Construir y publicar imágenes
        env:
          REGISTRO: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRO/nebula-server:${{ github.sha }} server
          docker push $REGISTRO/nebula-server:${{ github.sha }}
          docker build -t $REGISTRO/matchmaker:${{ github.sha }} matchmaking
          docker push $REGISTRO/matchmaker:${{ github.sha }}

  desplegar:
    needs: publicar
    runs-on: ubuntu-latest
    env:
      IMG: ${{ needs.publicar.outputs.registro }}/nebula-server:${{ github.sha }}
      IMG_MM: ${{ needs.publicar.outputs.registro }}/matchmaker:${{ github.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Conectar kubectl al clúster
        run: aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION
      - name: Actualizar la flota y el matchmaker a la imagen del commit
        run: |
          # El rol de GitHub solo puede parchar la flota y el matchmaker (k8s/aws/rbac-github.yaml)
          kubectl patch fleet nebula-fleet --type=json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/template/spec/containers/0/image\",\"value\":\"$IMG\"}]"
          kubectl set image deployment/matchmaker matchmaker=$IMG_MM
      - name: Esperar a que la flota tenga servidores Ready con la versión nueva
        run: |
          for i in $(seq 1 30); do
            listos=$(kubectl get gameservers -l agones.dev/fleet=nebula-fleet \
              -o jsonpath='{range .items[*]}{.status.state} {.spec.template.spec.containers[0].image}{"\n"}{end}' \
              | grep -c "^Ready $IMG$" || true)
            echo "servidores Ready con la versión nueva: $listos"
            [ "$listos" -ge 1 ] && exit 0
            sleep 10
          done
          echo "la versión nueva no llegó a Ready: revisa 'kubectl describe gameserver'"; exit 1
      - name: Estado final
        if: always()
        run: kubectl get fleet nebula-fleet && kubectl get gameservers
