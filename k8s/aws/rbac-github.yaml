# Permisos de GitHub Actions DENTRO del clúster (práctica 3.2, variante AWS).
# El rol nebula-github entra al grupo "github-deployer" (infra-aws/github.tf).
# Solo puede: actualizar la flota y la imagen del matchmaker, y leer el estado.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: default
rules:
  - apiGroups: ["agones.dev"]
    resources: ["fleets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["agones.dev"]
    resources: ["gameservers"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["matchmaker"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: default
subjects:
  - kind: Group
    name: github-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-deployer
  apiGroup: rbac.authorization.k8s.io
